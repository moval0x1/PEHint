# PEHint — Windows build + unit tests (Qt 6.10.2, MSVC, CMake)
name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          arch: win64_msvc2022_64
          cache: true

      # install-qt-action sets QT_ROOT_DIR to the kit root (e.g. .../msvc2022_64)
      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release

      - name: Unit tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
