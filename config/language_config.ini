[findings]
missing_cfg_help=Control Flow Guard validates indirect calls. Without it, return-oriented programming chains are easier to use.
few_imports_help=Very few imported DLLs can mean a tiny stub, a packer, or a self-contained binary. Compare with subsystem and section layout.
no_imports_help=User-mode EXEs usually import kernel32 and other system DLLs. Zero imports may indicate a packer, hand-crafted shellcode loader, or corrupt image.
zero_timestamp_help=A zero TimeDateStamp often means the linker did not record build time, or metadata was stripped. It is common in rebuilt or packed files.
old_timestamp_help=A very old compile date may indicate legacy software, a forged timestamp, or a deliberately backdated build.
future_timestamp_help=A timestamp in the future is invalid for a normal build and may indicate tampering or clock errors during linking.
delay_import_present_help=Delay-loaded imports resolve at first use, which can hide API usage from static import scans. Review the delay-import table.
checksum_zero_help=Many linkers leave CheckSum at zero. Packers and rebuilt binaries often do too; drivers and some signed builds expect a valid checksum.
checksum_mismatch_help=The stored checksum does not match the file contents. The image may have been modified after linking or rebuilt without updating the header.
dll_no_exports_help=Most DLLs export at least one symbol. An empty export table can mean a resource-only DLL, a loader stub, or an unusual build.
no_rich_header_help=The Rich Header records MSVC toolchain versions between the DOS and PE headers. Absence suggests non-MSVC tooling or header wiping.
pdb_present_help=A PDB path in the debug directory helps attribute builds and enables symbolized debugging. Malware authors sometimes leave PDB paths by mistake.
debug_info_stripped_help=This flag says debug info was removed at link time. You may still see CodeView/PDB records even when this flag is set.
writable_code_section_help=Code sections are normally read-only when loaded. Writable .text can indicate self-modifying code, unpacking stubs, or a bad linker flag.
executable_data_section_help=Data sections marked executable (e.g. .data with execute) are unusual and sometimes used to hide shellcode.
section_raw_gt_virtual_help=When raw size on disk exceeds virtual size, extra bytes may be uninitialized padding or hidden content. Compare with section entropy.
gui_few_imports_help=Graphical Windows programs typically import USER32/GDI32 and more. Very few imports in a GUI EXE can suggest packing or minimal launchers.
tls_callbacks_present_help=TLS callbacks run before the main entry point during process startup. Malware and protectors use them to unpack or anti-debug early.
relocations_stripped_aslr_help=ASLR needs base relocations at load time. Stripping relocs while enabling ASLR can break loading or indicate a conflicting linker setup.
version_info_missing_help=Version resources help identify vendor and product. Missing version info is common in tools and malware alike.
manifest_require_admin_help=requireAdministrator forces UAC elevation. Legitimate installers use it; malware may request admin for persistence or system changes.
high_ordinal_imports_help=Importing mostly by ordinal hides function names from the import table. Packers and some legitimate system DLLs do this.
packer_section_name_help=Section names like UPX0 or .themida match known packer/protector conventions. Treat as a hint, not proof.
flagged_import_help=This import matches a curated list of APIs often used in malware or suspicious tooling. Context matters — many legitimate apps use the same APIs.
hardcoded_url_help=URLs embedded in section data may be C2 endpoints, update servers, or debug strings. Click the finding to list matches and jump in hex.
hardcoded_ip_help=IPv4 strings in the file may be network endpoints or false positives (version numbers). Review matches in context.
nonstandard_dos_stub_help=The DOS stub usually prints 'This program cannot be run in DOS mode'. Unusual text can indicate tampering or custom stubs.
duplicate_exports_help=Duplicate export names break normal lookup semantics and may indicate a malformed or malicious export table.
import_combo_help=This import combination matches a known pattern (e.g. process injection APIs). Review the listed functions and the import tree.
hardcoded_registry_help=Registry paths in binary data may point to persistence keys or configuration. Click the finding to review each match.
suspicious_command_help=Command-line fragments (cmd.exe, powershell, schtasks, etc.) in section data can indicate droppers or scripts. Review matches in hex.
