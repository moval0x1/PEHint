# Dependencies tab
deps_header_module=Module
deps_header_resolved_path=Resolved path
deps_header_found=Found
deps_tag_cycle=cycle
deps_tag_max_depth=max-depth
deps_tooltip_direct=This module is listed directly in the opened PE file's Import Directory. At load time the Windows loader resolves this DLL name using standard search order (application directory, System32, PATH, etc.) unless manifest or SxS changes that behavior.
deps_tooltip_transitive=This module was discovered by reading the Import Directory of a parent DLL in the tree. It is an indirect (transitive) dependency: your program needs it because one of its dependent DLLs imports it.
deps_tooltip_cycle=A cycle means the same logical dependency appears again while walking the tree. Real loaders handle already-loaded modules and activation contexts; this tag only marks the repetition in our static walk.
deps_tooltip_truncated=PEHint stops recursing after a fixed depth to keep the view fast. Expand policy: deeper levels are not shown here; use Dependency Walker, SDK tools, or inspect the child's own imports for full chains.
deps_tooltip_not_found=PEHint only checks a subset of search paths (PE directory, System32, SysWOW64, PATH). A "No" here does not prove the DLL is missing at runtime — side-by-side manifests, the app directory, or delayed load can still apply.
deps_tooltip_resolved_line=Resolved to: {path}
deps_tooltip_no_path=No file path was resolved — import name is still valid for the loader, which may find the module elsewhere.

