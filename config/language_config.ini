high_file_entropy_title=High file entropy
high_file_entropy_detail=Whole-file Shannon entropy is {value} (threshold {threshold} bits/byte).
high_file_entropy_help=High entropy often means packing, encryption, or compressed data. Compare with section entropy and imports; open the file in a disassembler if it looks suspicious.
high_section_entropy_title=High section entropy
high_section_entropy_detail=Section {section}: entropy is {value} (threshold {threshold}).
high_section_entropy_help=One section with high entropy may be resources, crypto constants, or packed code. Check which section it is and whether it is marked executable.
overlay_present_help=Overlay is data appended after the PE layout ends. Installers, self-extractors, and some malware use it. Inspect overlay bytes in the hex view.
missing_aslr_help=Without ASLR, the program loads at the same address every time, which makes exploitation easier. Legitimate old tools may lack it; malware often disables it on purpose.
missing_dep_help=DEP (NX) marks data pages non-executable. When missing, code might run from writable memory — a common exploit technique.
unsigned_executable_help=No publisher signature means you cannot verify who built the file. Use hashes (MD5/SHA256) and other findings; signed is not proof of safety, but unsigned needs extra scrutiny.
suspicious_ep_help=The entry point should usually be in .text. If it sits in an odd or writable section, the file may be packed or modified. Jump to the EP in the hex view and inspect instructions.
rwx_section_help=Memory should rarely be readable, writable, and executable at once. This pattern is common in shellcode loaders and some packers.
