# Section Type Information
section_info_text=This section contains the executable code of the program.
section_info_data=This section contains initialized data that can be read and written.
section_info_rdata=This section contains read-only initialized data, typically constants and string literals.
section_info_rsrc=This section contains resources such as icons, bitmaps, dialogs, and version information.
section_info_reloc=This section contains relocation information for when the executable cannot be loaded at its preferred base address.
section_info_idata=This section contains import information, listing DLLs and functions that the executable depends on.
section_info_edata=This section contains export information, listing functions and data that this module exports.
section_info_tls=This section stores Thread Local Storage (TLS) templates and callbacks used during per-thread initialization.
section_info_gfids=This section stores Control Flow Guard (CFG) function IDs used by the loader/runtime for indirect-call validation.
section_info_pdata=This section contains runtime function table entries used for exception unwinding (especially on x64/ARM).
section_info_xdata=This section stores unwind metadata referenced by .pdata entries.
section_info_didat=This section contains delay-load import tables used when DLLs are resolved on first use.
section_info_crt=This section stores C/C++ runtime initializer and terminator arrays (global constructors/destructors).
section_info_cfg=This section stores Control Flow Guard metadata and helper tables.
section_info_sxdata=This section contains Safe Exception Handler / structured exception metadata for some toolchains.
section_info_debug=This section stores debug directory and symbol-related metadata.
section_info_cormeta=This section contains CLR/.NET metadata streams in managed images.
section_info_managed=This section contains IL/managed runtime data used by .NET executables.

