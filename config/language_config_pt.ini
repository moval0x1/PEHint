# Section Type Information
section_info_text=Esta seção contém o código executável do programa.
section_info_data=Esta seção contém dados inicializados que podem ser lidos e gravados.
section_info_rdata=Esta seção contém dados inicializados somente leitura, geralmente constantes e literais de string.
section_info_rsrc=Esta seção contém recursos como ícones, bitmaps, diálogos e informações de versão.
section_info_reloc=Esta seção contém informações de relocação para quando o executável não pode ser carregado em seu endereço base preferido.
section_info_idata=Esta seção contém informações de importação, listando DLLs e funções das quais o executável depende.
section_info_edata=Esta seção contém informações de exportação, listando funções e dados que este módulo exporta.
section_info_tls=Esta seção armazena templates de Thread Local Storage (TLS) e callbacks usados na inicialização por thread.
section_info_gfids=Esta seção armazena IDs de funções do Control Flow Guard (CFG), usados na validação de chamadas indiretas.
section_info_pdata=Esta seção contém entradas da tabela de funções em tempo de execução usadas no unwind de exceções (especialmente em x64/ARM).
section_info_xdata=Esta seção armazena metadados de unwind referenciados pelas entradas de .pdata.
section_info_didat=Esta seção contém tabelas de importação de delay-load, usadas quando DLLs são resolvidas sob demanda.
section_info_crt=Esta seção armazena arrays de inicialização/finalização do runtime C/C++ (construtores/destrutores globais).
section_info_cfg=Esta seção armazena metadados e tabelas auxiliares do Control Flow Guard.
section_info_sxdata=Esta seção contém metadados de exceção estruturada/SafeSEH em alguns toolchains.
section_info_debug=Esta seção armazena diretórios de debug e metadados relacionados a símbolos.
section_info_cormeta=Esta seção contém streams de metadados CLR/.NET em imagens gerenciadas.
section_info_managed=Esta seção contém IL/dados de runtime gerenciado usados por executáveis .NET.

