deps_tag_cycle=ciclo
deps_tag_max_depth=prof-máx
deps_tooltip_direct=Este módulo aparece diretamente no Diretório de Importação do PE aberto. Durante o carregamento, o carregador do Windows resolve o nome usando a ordem de busca padrão (pasta do aplicativo, System32, PATH, etc.), a menos que manifesto ou SxS alterem o comportamento.
deps_tooltip_transitive=Este módulo foi encontrado ao ler o Diretório de Importação de um DLL pai na árvore. É uma dependência indireta (transitiva): seu programa precisa dele porque um dos DLLs dos quais depende o importa.
deps_tooltip_cycle=Um ciclo significa que a mesma dependência lógica volta a aparecer ao percorrer a árvore. O carregador do Windows trata módulos já carregados e contextos de ativação; esta marca apenas indica a repetição na nossa análise estática.
deps_tooltip_truncated=O PEHint limita a profundidade da recursão para manter a interface rápida. Níveis mais profundos não são mostrados aqui; use Dependency Walker, ferramentas do SDK ou analise os imports do filho para ver cadeias completas.
deps_tooltip_not_found=O PEHint verifica apenas um subconjunto de caminhos (pasta do PE, System32, SysWOW64, PATH). \"Não\" aqui não prova que a DLL falta em tempo de execução — manifesto side-by-side, pasta do app ou carregamento adiado ainda podem aplicar.
deps_tooltip_resolved_line=Resolvido para: {path}
deps_tooltip_no_path=Nenhum caminho de arquivo foi resolvido — o nome de import ainda é válido para o carregador, que pode encontrar o módulo em outro local.

